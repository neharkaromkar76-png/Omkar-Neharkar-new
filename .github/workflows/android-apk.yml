name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MotionMatch AI Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          set -e
          echo "=== Configuring Android SDK ==="
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory ($ANDROID_HOME) not found on runner!"
            exit 1
          fi

          # Locate sdkmanager executable
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools"/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager could not be located in $ANDROID_HOME/cmdline-tools!"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          # Non-interactive license acceptance
          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # Install only the SDK packages actually required by this project (compileSdk 36, platform-tools)
          echo "Installing required packages: platform-tools, platforms;android-36..."
          if ! "$SDKMANAGER" --install "platform-tools" "platforms;android-36"; then
            echo "::error::Failed to install required Android SDK packages via sdkmanager."
            exit 1
          fi

          echo "Android SDK configured successfully."

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Prepare build environment
        run: |
          # Restore .env if not present
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # Generate debug keystore if it does not exist
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate Debug APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*debug*.apk" -type f | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated by Gradle build task (:app:assembleDebug)!"
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionMatch-AI-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error
